[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hourglass-stealth"
version = "0.1.0"
description = "Technical calculation scaffold for the hourglass stealth spacecraft concept."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ipykernel",
  "jupyter",
  "matplotlib",
  "numpy",
  "openpyxl",
  "pandas",
  "pytest",
  "scipy",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hourglass_stealth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
